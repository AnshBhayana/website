<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Primary SEO -->
    <title>Ansh Bhayana | Content Creator, Producer & Strategist</title>

    <meta
      name="description"
      content="Ansh Bhayana is a Delhi-based content creator, producer and strategist. Content strategy, viral ideation, on-camera work and production for brands. 40+ celebrity interviews, 50+ sponsored trips."
    />

    <!-- Browser Theme Color -->
    <meta name="theme-color" content="#E95D2A" />

    <!-- ==========================================
         FAVICONS - VERSION 8 (AB logo)
         Files located in /public/
    =========================================== -->

    <!-- Multi-size ICO (fallback for older browsers and default /favicon.ico requests) -->
    <link rel="icon" href="/favicon.ico?v=9" sizes="any" />

    <!-- PNG favicons -->
    <link
      rel="icon"
      type="image/png"
      sizes="48x48"
      href="/favicon-48x48.png?v=9"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/favicon-32x32.png?v=9"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/favicon-16x16.png?v=9"
    />

    <!-- Apple Touch Icon -->
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/apple-touch-icon.png?v=9"
    />

    <!-- ==========================================
         CANONICAL URL
    =========================================== -->

    <link
      rel="canonical"
      href="https://www.anshbhayana.com/"
    />

    <!-- ==========================================
         OPEN GRAPH / SOCIAL SHARING
    =========================================== -->

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Ansh Bhayana" />

    <meta
      property="og:title"
      content="Ansh Bhayana | We make content people can't scroll past"
    />

    <meta
      property="og:description"
      content="Content creator, producer and strategist. Ideas, stories, strategy and execution, from the first idea to the final frame."
    />

    <meta
      property="og:url"
      content="https://www.anshbhayana.com/"
    />

    <meta
      property="og:image"
      content="https://www.anshbhayana.com/assets/ansh-hero.webp"
    />

    <!-- Twitter / X -->
    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <!-- ==========================================
         PERFORMANCE
    =========================================== -->

    <!-- Preload hero image -->
    <link
      rel="preload"
      as="image"
      href="/assets/ansh-hero.webp"
      fetchpriority="high"
    />
  </head>

  <body>
    <!-- React Application -->
    <div id="root"></div>

    <!-- Vite Entry Point -->
    <script
      type="module"
      src="/src/main.jsx"
    ></script>
  </body>
</html>
