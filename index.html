<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Primary SEO -->
    <title>Ansh Bhayana | Content Creator, Producer & Strategist</title>

    <meta
      name="description"
      content="Ansh Bhayana is a Delhi-based content creator, producer and strategist. Content strategy, viral ideation, on-camera work and production for brands. 40+ celebrity interviews, 50+ sponsored trips."
    />

    <!-- Browser Theme Color -->
    <meta name="theme-color" content="#E95D2A" />

    <!-- Google needs a stable, crawlable favicon URL (square, multiple of 48px).
         No ?v= cache-busters: changing the URL resets Google's favicon crawl. -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" href="/favicon-48x48.png" sizes="48x48" />
    <link rel="icon" type="image/png" href="/icon-192x192.png" sizes="192x192" />
    <link rel="icon" type="image/png" href="/favicon-32x32.png" sizes="32x32" />
    <link rel="icon" type="image/png" href="/favicon-16x16.png" sizes="16x16" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Tells Google the site name and its logo -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "https://www.anshbhayana.com/#website",
            "url": "https://www.anshbhayana.com/",
            "name": "Ansh Bhayana",
            "alternateName": ["Ansh Bhayana Content Strategist"]
          },
          {
            "@type": "Person",
            "@id": "https://www.anshbhayana.com/#person",
            "name": "Ansh Bhayana",
            "url": "https://www.anshbhayana.com/",
            "image": "https://www.anshbhayana.com/icon-512x512.png",
            "jobTitle": "Content Strategist, Creator & Creative Producer"
          }
        ]
      }
    </script>

    <!-- ==========================================
         CANONICAL URL
    =========================================== -->

    <link
      rel="canonical"
      href="https://www.anshbhayana.com/"
    />

    <!-- ==========================================
         OPEN GRAPH / SOCIAL SHARING
    =========================================== -->

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Ansh Bhayana" />

    <meta
      property="og:title"
      content="Ansh Bhayana | We make content people can't scroll past"
    />

    <meta
      property="og:description"
      content="Content creator, producer and strategist. Ideas, stories, strategy and execution, from the first idea to the final frame."
    />

    <meta
      property="og:url"
      content="https://www.anshbhayana.com/"
    />

    <meta
      property="og:image"
      content="https://www.anshbhayana.com/assets/ansh-hero.webp"
    />

    <!-- Twitter / X -->
    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <!-- ==========================================
         PERFORMANCE
    =========================================== -->

    <!-- Preload hero image -->
    <link
      rel="preload"
      as="image"
      href="/assets/ansh-hero.webp"
      fetchpriority="high"
    />
  </head>

  <body>
    <!-- React Application -->
    <div id="root"></div>

    <!-- Vite Entry Point -->
    <script
      type="module"
      src="/src/main.jsx"
    ></script>
  </body>
</html>
